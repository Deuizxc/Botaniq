<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3526">
  <meta name="description" content="BotaniQ — garden tracking and resource management for CUAI.">
  <title>BotaniQ · Garden workspace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
  <div id="app">
    <div class="boot" role="status">
      <div class="boot-card">
        <svg class="growing-plant" viewBox="0 0 120 140" aria-hidden="true">
          <path class="plant-stem" d="M60 124V38"/>
          <path class="plant-leaf leaf-one" d="M60 100C33 100 25 82 25 66c24 0 35 14 35 34Z"/>
          <path class="plant-leaf leaf-two" d="M60 80c26 0 35-18 35-34-24 0-35 14-35 34Z"/>
          <path class="plant-leaf leaf-three" d="M60 57C38 56 30 39 30 23c22 1 30 14 30 34Z"/>
          <path class="plant-leaf leaf-four" d="M60 42c21-1 29-15 29-30-21 0-29 12-29 30Z"/>
          <path class="plant-soil" d="M42 125h36"/>
        </svg>
        <strong>BotaniQ is growing</strong>
        <span>Preparing your garden workspace…</span>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <noscript>Enable JavaScript to use the garden workspace.</noscript>
  <script type="module" src="js/script.js"></script>
</body>
</html>
